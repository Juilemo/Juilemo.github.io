                        isOpen: true,
                        isMinimized: false,
                        isMaximized: false,
                        zIndex: newZ,
                        position: { x: Math.max(20, 50 + prev.length * 30), y: Math.max(40, 50 + prev.length * 30) },
                        size: { w: 900, h: 650 }
                    }];
                });
                setActiveWindowId(id);
            };

            const closeWindow = (id) => {
                setWindows(prev => prev.filter(w => w.id !== id));
                if (activeWindowId === id) setActiveWindowId(null);
            };

            const minimizeWindow = (id) => {
                setWindows(prev => prev.map(w => w.id === id ? { ...w, isMinimized: true } : w));
                setActiveWindowId(null);
            };

            const toggleMaximizeWindow = (id) => {
                setWindows(prev => prev.map(w => w.id === id ? { ...w, isMaximized: !w.isMaximized } : w));
            };

            const focusWindow = (id) => {
                if (activeWindowId === id) return;
                const newZ = zIndexCounter + 1;
                setZIndexCounter(newZ);
                setWindows(prev => prev.map(w => w.id === id ? { ...w, zIndex: newZ } : w));
                setActiveWindowId(id);
            };

            const handleMouseDown = (e, id, win, type, direction) => {
                if (win.isMaximized) return; 
                if (type === 'move' && e.target.closest('.window-controls')) return; 

                e.preventDefault();
                e.stopPropagation();
                focusWindow(id);

                setDragState({
                    type,
                    id,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialLeft: win.position.x,
                    initialTop: win.position.y,
                    initialWidth: win.size.w,
                    initialHeight: win.size.h,
                    direction
                });
            };

            const handleMouseMove = (e) => {
                if (!dragState) return;
                e.preventDefault();
                
                const deltaX = e.clientX - dragState.startX;
                const deltaY = e.clientY - dragState.startY;

                setWindows(prev => prev.map(w => {
                    if (w.id === dragState.id) {
                        if (dragState.type === 'move') {
                            return {
                                ...w,
                                position: {
                                    x: dragState.initialLeft + deltaX,
                                    y: dragState.initialTop + deltaY
                                }
                            };
                        } else if (dragState.type === 'resize') {
                            let newW = dragState.initialWidth;
                            let newH = dragState.initialHeight;
                            let newX = dragState.initialLeft;
                            let newY = dragState.initialTop;

                            if (dragState.direction?.includes('e')) newW = Math.max(400, dragState.initialWidth + deltaX);
                            if (dragState.direction?.includes('s')) newH = Math.max(300, dragState.initialHeight + deltaY);
                            if (dragState.direction?.includes('w')) {
                                const proposedWidth = dragState.initialWidth - deltaX;
                                if (proposedWidth > 400) {
                                    newW = proposedWidth;
                                    newX = dragState.initialLeft + deltaX;
                                }
                            }
                            if (dragState.direction?.includes('n')) {
                                const proposedHeight = dragState.initialHeight - deltaY;
                                if (proposedHeight > 300) {
                                    newH = proposedHeight;
                                    newY = dragState.initialTop + deltaY;
                                }
                            }

                            return {
                                ...w,
                                position: { x: newX, y: newY },
                                size: { w: newW, h: newH }
                            };
                        }
                    }
                    return w;
                }));
            };

            const handleMouseUp = () => {
                setDragState(null);
            };

            return (
                <div 
                    className="absolute inset-0 w-full h-full bg-cover bg-center overflow-hidden transition-all duration-700 ease-spring"
                    style={{ backgroundImage: `url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2940&q=80')` }}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                >
                    {/* Mac Menu Bar */}
                    <div className={`h-8 w-full backdrop-blur-md border-b flex items-center justify-between px-4 text-sm font-medium z-[9999] select-none shadow-sm transition-colors duration-300
                        ${isDark 
                        ? 'bg-gray-900/60 border-white/10 text-gray-100' 
                        : 'bg-white/60 border-black/5 text-gray-900'
                        }`}>
                        <div className="flex items-center gap-5">
                        <i className="ph-fill ph-apple-logo text-lg" />
                        <span className="font-bold hidden sm:block">MeiOS</span>
                        {['File', 'Edit', 'View', 'Go', 'Window', 'Help'].map(m => (
                            <span key={m} className="hidden sm:block cursor-pointer hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded transition-colors">{m}</span>
                        ))}
                        </div>
                        <div className="flex items-center gap-4">
                        <button onClick={onSwitchMode} className="hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded flex items-center gap-2 transition-colors" title="Switch to iPhone">
                            <i className="ph ph-device-mobile text-lg" />
                            <span className="text-xs font-semibold hidden sm:inline">Mobile View</span>
                        </button>
                        <button onClick={toggleTheme} className="hover:bg-black/5 dark:hover:bg-white/10 px-2 py-0.5 rounded flex items-center gap-2 transition-colors">
                            <i className={isDark ? "ph-fill ph-sun text-yellow-300" : "ph-fill ph-moon"} />
                            <span className="text-xs hidden sm:inline">Theme</span>
                        </button>
                        <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="flex items-center gap-2 text-xs font-bold border border-current px-1 rounded hover:opacity-70 transition-opacity">
                            <span>{lang === 'en' ? 'EN' : '中'}</span>
                        </button>
                        <div className="flex items-center gap-3 pl-2 border-l border-current opacity-60">
                            <i className="ph-fill ph-wifi-high text-lg" />
                            <i className="ph ph-magnifying-glass text-lg" />
                            <i className="ph-fill ph-control text-lg" />
                            <span className="mr-2 font-semibold min-w-[60px] text-center">{time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        </div>
                    </div>

                    {/* Desktop Area / Windows */}
                    <div className="relative w-full h-[calc(100%-80px)] p-4">
                        {/* Desktop Icons */}
                        <div className="absolute right-4 top-12 flex flex-col gap-6 items-center w-24 select-none z-0">
                            <div className="flex flex-col items-center group cursor-pointer" onDoubleClick={() => openWindow('finder')}>
                                <div className="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl flex items-center justify-center shadow-lg mb-1 group-hover:scale-105 transition-transform border border-white/20">
                                    <i className="ph-fill ph-user-list text-white text-3xl" />
                                </div>
                                <span className="text-white text-xs font-medium drop-shadow-md bg-black/30 px-2 py-0.5 rounded-full">{lang === 'zh' ? '我的简历' : 'Resume'}</span>
                            </div>
                            
                            <div className="flex flex-col items-center group cursor-pointer" onDoubleClick={() => openWindow('safari')}>
                                <div className="w-16 h-16 bg-white rounded-xl flex items-center justify-center shadow-lg mb-1 group-hover:scale-105 transition-transform">
                                    <i className="ph-fill ph-globe text-blue-500 text-4xl" />
                                </div>
                                <span className="text-white text-xs font-medium drop-shadow-md bg-black/30 px-2 py-0.5 rounded-full">Website</span>
                            </div>
                        </div>

                        {/* Windows */}
                        {windows.map(win => {
                            if (win.isMinimized) return null;
                            const config = APP_CONFIGS.find(c => c.id === win.id);
                            if (!config) return null;
                            const Component = config.component;
                            const isDragging = dragState?.id === win.id;

                            return (
                                <div
                                key={win.id}
                                className={`absolute rounded-xl overflow-hidden shadow-2xl border flex flex-col 
                                    ${isDragging ? 'transition-none' : 'transition-all duration-300 ease-spring'} 
                                    ${win.isMaximized ? 'inset-0 m-0 !top-0 !left-0 !w-full !h-full !rounded-none z-[50]' : ''}
                                    ${isDark ? 'border-gray-700 shadow-black/50' : 'border-white/40 shadow-xl'}`}
                                style={!win.isMaximized ? {
                                    width: win.size.w,
                                    height: win.size.h,
                                    left: win.position.x,
                                    top: win.position.y,
                                    zIndex: win.zIndex,
                                    opacity: win.isOpen ? 1 : 0,
                                    transform: win.isOpen ? 'scale(1)' : 'scale(0.95)',
                                } : { zIndex: win.zIndex }}
                                onMouseDown={() => focusWindow(win.id)}
                                >
                                {!win.isMaximized && (
                                    <>
                                    <div className="absolute top-0 left-0 w-full h-1 cursor-n-resize z-50" onMouseDown={(e) => handleMouseDown(e, win.id, win, 'resize', 'n')} />
                                    <div className="absolute bottom-0 left-0 w-full h-1 cursor-s-resize z-50" onMouseDown={(e) => handleMouseDown(e, win.id, win, 'resize', 's')} />
                                    <div className="absolute top-0 left-0 w-1 h-full cursor-w-resize z-50" onMouseDown={(e) => handleMouseDown(e, win.id, win, 'resize', 'w')} />
                                    <div className="absolute top-0 right-0 w-1 h-full cursor-e-resize z-50" onMouseDown={(e) => handleMouseDown(e, win.id, win, 'resize', 'e')} />
                                    <div className="absolute bottom-right-0 w-4 h-4 cursor-se-resize z-50 right-0 bottom-0" onMouseDown={(e) => handleMouseDown(e, win.id, win, 'resize', 'se')} />
                                    </>
                                )}

                                {/* Window Header */}
                                <div 
                                    className={`h-9 flex items-center px-4 relative border-b select-none cursor-default transition-colors duration-300
                                        ${isDark ? 'bg-[#2c2c2c] border-black text-gray-300' : 'bg-[#f0f0f0] border-gray-300 text-gray-600'}`}
                                    onMouseDown={(e) => handleMouseDown(e, win.id, win, 'move')}
                                    onDoubleClick={() => toggleMaximizeWindow(win.id)}
                                >
                                    <div className="flex gap-2 group absolute left-4 window-controls z-10">
                                    <div onClick={(e) => { e.stopPropagation(); closeWindow(win.id); }} className="w-3 h-3 rounded-full bg-[#ff5f57] border border-[#e0443e] cursor-pointer flex items-center justify-center text-[8px] text-transparent hover:text-black/50 transition-colors"><i className="ph-bold ph-x" /></div>
                                    <div onClick={(e) => { e.stopPropagation(); minimizeWindow(win.id); }} className="w-3 h-3 rounded-full bg-[#febc2e] border border-[#d89e24] cursor-pointer flex items-center justify-center text-[8px] text-transparent hover:text-black/50 transition-colors"><i className="ph-bold ph-minus" /></div>
                                    <div onClick={(e) => { e.stopPropagation(); toggleMaximizeWindow(win.id); }} className="w-3 h-3 rounded-full bg-[#28c840] border border-[#1aab29] cursor-pointer flex items-center justify-center text-[8px] text-transparent hover:text-black/50 transition-colors"><i className={`ph-bold ${win.isMaximized ? 'ph-arrows-in-simple' : 'ph-arrows-out-simple'}`} /></div>
                                    </div>
                                    <div className="w-full text-center text-sm font-semibold flex items-center justify-center gap-2 pointer-events-none">
                                        <i className={`${config.icon} ${isDark ? 'text-gray-400' : 'text-gray-500'}`} />
                                        {config.title}
                                    </div>
                                </div>
                                
                                <div className="flex-1 bg-white dark:bg-[#1e1e1e] relative overflow-hidden flex flex-col">
                                    {dragState && <div className="absolute inset-0 z-50 bg-transparent" />}
                                    <Component lang={lang} isDark={isDark} />
                                </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Dock */}
                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-[10000]">
                        <div className={`backdrop-blur-xl border px-4 py-3 rounded-2xl flex items-end gap-3 shadow-2xl transform transition-transform duration-300 hover:scale-105
                        ${isDark ? 'bg-black/40 border-white/10' : 'bg-white/40 border-white/20'}`}>
                        {APP_CONFIGS.map(app => (
                            <div key={app.id} className="relative group flex flex-col items-center">
                            <button 
                                onClick={() => openWindow(app.id)}
                                className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-lg hover:-translate-y-4 hover:scale-110 transition-all duration-300 ease-spring ${app.color} ${app.id === 'safari' ? 'border border-gray-200' : 'border border-transparent'}`}
                            >
                                {app.id === 'safari' ? (
                                    <i className="ph-fill ph-compass text-blue-500 text-3xl" />
                                ) : (
                                    <i className={`${app.icon} ${app.id === 'terminal' || app.id === 'gemini' || app.id === 'mail' ? 'text-white' : 'text-white'}`} />
                                )}
                            </button>
                            {/* Active Dot */}
                            {windows.find(w => w.id === app.id) && (
                                <div className={`w-1 h-1 rounded-full absolute -bottom-2 ${isDark ? 'bg-white' : 'bg-gray-800'}`} />
                            )}
                            {/* Tooltip */}
                            <div className="absolute -top-12 bg-gray-900/90 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-xl backdrop-blur-sm border border-white/10">
                                {app.title}
                            </div>
                            </div>
                        ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. 移动端环境 (MobileEnv) ---

        const AppIcon = ({ app, inDock = false, isDark, onClick }) => (
            <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => onClick(app.id)}>
                <div className={`w-[60px] h-[60px] rounded-[14px] flex items-center justify-center text-3xl shadow-md active:scale-90 transition-transform duration-200 ease-ios ${app.color}`}>
                <i className={`${app.icon} ${app.id === 'safari' || app.color.includes('bg-white') || app.color.includes('bg-gray-300') || app.color.includes('bg-green-100') || app.color.includes('bg-yellow-100') ? '' : 'text-white'}`} />
                </div>
                {!inDock && (
                <span className={`text-[11px] font-medium tracking-tight group-hover:opacity-80 transition-colors duration-300 
                    ${isDark ? 'text-white drop-shadow-md' : 'text-black font-semibold'}`}>
                    {app.title}
                </span>
                )}
            </div>
        );

        const MobileEnv = ({ lang, setLang, toggleTheme, isDark, onSwitchMode }) => {
            const [openApp, setOpenApp] = useState(null);
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const handleAppClick = (id) => {
                setOpenApp(id);
            };

            const activeAppConfig = MOBILE_APPS.find(a => a.id === openApp);
            const ActiveComponent = activeAppConfig?.component;

            return (
                <div className="absolute inset-0 w-full h-full bg-black overflow-hidden flex justify-center items-center font-sans">
                <div className={`relative w-full h-full bg-cover bg-center overflow-hidden transition-colors duration-500
                    ${isDark ? 'bg-[#000]' : 'bg-[#fff]'}`}
                    style={!isDark ? { backgroundImage: `url('https://images.unsplash.com/photo-1597836888466-261f94348575?ixlib=rb-4.0.3&auto=format&fit=crop&w=1887&q=80')` } : {}}
                >
                    {isDark && (
                        <div className="absolute inset-0 bg-gradient-to-b from-gray-900 to-black z-0" />
                    )}
                    
                    {/* iOS Status Bar */}
                    <div className={`h-[44px] w-full flex justify-between items-center px-6 z-50 absolute top-0 left-0 transition-colors duration-300
                        ${openApp ? (isDark ? 'bg-black/90 text-white' : 'bg-white/90 text-black') : (isDark ? 'text-white' : 'text-black')}`}>
                        
                        <div className="font-semibold text-[13px] w-14 tracking-wide text-center whitespace-nowrap">
                        {time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </div>
                        
                        <div className="flex items-center gap-1.5 w-16 justify-end">
                        <i className="ph-fill ph-cell-signal-full text-[16px]" />
                        <i className="ph-fill ph-wifi-high text-[16px]" />
                        <div className={`relative w-[22px] h-[11px] border rounded-[3px] ${isDark || openApp ? (isDark ? 'border-white/40' : 'border-black/40') : 'border-black/40'}`}>
                            <div className={`absolute top-[1px] left-[1px] bottom-[1px] w-[14px] rounded-[1px] ${isDark || openApp ? (isDark ? 'bg-white' : 'bg-black') : 'bg-black'}`} />
                            <div className={`absolute -right-[3px] top-[3px] h-[4px] w-[2px] rounded-r-[1px] ${isDark || openApp ? (isDark ? 'bg-white/40' : 'bg-black/40') : 'bg-black/40'}`} />
                        </div>
                        </div>
                    </div>

                    {!openApp && (
                        <button 
                        onClick={onSwitchMode}
                        className={`absolute top-14 right-6 z-40 backdrop-blur-lg border rounded-full p-2 transition active:scale-95 shadow-lg
                            ${isDark ? 'bg-white/10 border-white/20 text-white hover:bg-white/20' : 'bg-black/10 border-black/10 text-black hover:bg-black/20'}`}
                        title="Switch to Desktop"
                        >
                        <i className="ph ph-monitor text-xl" />
                        </button>
                    )}

                    {/* Home Screen */}
                    <div className={`pt-20 px-6 grid grid-cols-4 gap-x-5 gap-y-7 content-start h-full transition-all duration-500 ease-ios z-10 relative ${openApp ? 'scale-90 opacity-0 pointer-events-none blur-sm' : 'scale-100 opacity-100 blur-0'}`}>
                        <div onClick={toggleTheme} className="flex flex-col items-center gap-1.5 cursor-pointer group">
                        <div className={`w-[60px] h-[60px] rounded-[14px] flex items-center justify-center text-3xl shadow-md active:scale-90 transition-transform duration-200 ease-ios bg-gray-500 text-white border border-white/10`}>
                            <i className={isDark ? "ph-fill ph-sun" : "ph-fill ph-moon"} />
                        </div>
                        <span className={`text-[11px] font-medium tracking-tight group-hover:opacity-80 transition-colors duration-300 ${isDark ? 'text-white drop-shadow-md' : 'text-black font-semibold'}`}>
                            Theme
                        </span>
                        </div>

                        <div onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} className="flex flex-col items-center gap-1.5 cursor-pointer group">
                        <div className="w-[60px] h-[60px] rounded-[14px] flex items-center justify-center text-xl font-bold bg-gray-500/80 backdrop-blur text-white shadow-md active:scale-90 transition-transform border border-white/10">
                            {lang === 'zh' ? 'CN' : 'EN'}
                        </div>
                        <span className={`text-[11px] font-medium tracking-tight group-hover:opacity-80 transition-colors duration-300 ${isDark ? 'text-white drop-shadow-md' : 'text-black font-semibold'}`}>
                            Language
                        </span>
                        </div>
                    </div>

                    {/* Mobile Dock */}
                    <div className={`absolute bottom-6 left-4 right-4 h-[85px] rounded-[30px] flex items-center justify-around px-2 transition-transform duration-500 ease-ios z-10
                        ${isDark ? 'bg-black/40 backdrop-blur-[30px] border border-white/5' : 'bg-white/40 backdrop-blur-[30px] border border-white/20'}
                        ${openApp ? 'translate-y-[120px]' : 'translate-y-0'}`}>
                        {MOBILE_APPS.map(app => (
                        <AppIcon key={app.id} app={app} inDock isDark={isDark} onClick={handleAppClick} />
                        ))}
                    </div>

                    {/* Opened App View */}
                    <div className={`absolute inset-0 z-40 transition-all duration-500 ease-ios flex flex-col 
                        ${openApp ? 'translate-y-0 rounded-none scale-100' : 'translate-y-full rounded-t-[40px] scale-95'}
                        ${isDark ? 'bg-black' : 'bg-[#f2f2f7]'}`}>
                        {openApp && (
                        <div className="flex-1 flex flex-col pt-[44px] relative overflow-hidden">
                            <div className={`h-10 px-4 flex items-center justify-between border-b z-10 shrink-0 transition-colors duration-300
                                ${isDark ? 'bg-[#1c1c1e] border-gray-800' : 'bg-white border-gray-200'}`}>
                                <button onClick={() => setOpenApp(null)} className="flex items-center text-blue-500 gap-1 text-[15px] active:opacity-50">
                                    <i className="ph-bold ph-caret-left" />
                                    Back
                                </button>
                                <span className={`font-semibold text-[15px] ${isDark ? 'text-white' : 'text-black'}`}>{MOBILE_APPS.find(a => a.id === openApp)?.title}</span>
                                <div className="w-8" />
                            </div>
                            
                            <div className={`flex-1 overflow-y-auto ${isDark ? 'bg-black' : 'bg-white'}`}>
                                {ActiveComponent && <ActiveComponent lang={lang} isDark={isDark} />}
                            </div>

                            <div className="h-8 w-full flex justify-center items-end pb-2 bg-transparent absolute bottom-0 left-0 z-50 cursor-pointer pointer-events-auto" onClick={() => setOpenApp(null)}>
                                <div className={`w-[130px] h-[5px] rounded-full transition-colors ${isDark ? 'bg-white/20 hover:bg-white/40' : 'bg-black/20 hover:bg-black/40'}`} />
                            </div>
                        </div>
                        )}
                    </div>

                </div>
                </div>
            );
        };

        // --- 5. 主程序 (App) ---

        const App = () => {
            const [mode, setMode] = useState('desktop');
            const [lang, setLang] = useState('zh');
            const [isDark, setIsDark] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);

            useEffect(() => {
                const checkMobile = () => {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isMobileDevice = /android|ipad|iphone|ipod/i.test(userAgent.toLowerCase());
                const isSmallScreen = window.innerWidth < 768;
                
                if (isMobileDevice || isSmallScreen) {
                    setMode('mobile');
                } else {
                    setMode('desktop');
                }
                };
                checkMobile();
            }, []);

            const handleSwitch = () => {
                setIsTransitioning(true);
                setTimeout(() => {
                setMode(prev => prev === 'desktop' ? 'mobile' : 'desktop');
                setTimeout(() => setIsTransitioning(false), 50);
                }, 400); 
            };

            const toggleTheme = () => {
                setIsDark(!isDark);
                if (!isDark) {
                document.documentElement.classList.add('dark');
                } else {
                document.documentElement.classList.remove('dark');
                }
            };

            return (
                <div className={`relative w-screen h-screen overflow-hidden bg-black text-gray-900 dark:text-gray-100`}>
                
                <div className={`absolute inset-0 transition-all duration-700 ease-spring transform origin-center
                    ${mode === 'desktop' ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-90 pointer-events-none'}`}>
                    <DesktopEnv 
                        lang={lang} 
                        setLang={setLang} 
                        isDark={isDark} 
                        toggleTheme={toggleTheme} 
                        onSwitchMode={handleSwitch}
                    />
                </div>

                <div className={`absolute inset-0 transition-all duration-700 ease-spring transform origin-center
                    ${mode === 'mobile' ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-110 pointer-events-none'}`}>
                    <MobileEnv 
                        lang={lang} 
                        setLang={setLang} 
                        isDark={isDark} 
                        toggleTheme={toggleTheme} 
                        onSwitchMode={handleSwitch}
                    />
                </div>
                
                <div className={`absolute inset-0 bg-black pointer-events-none transition-opacity duration-300 ${isTransitioning ? 'opacity-20' : 'opacity-0'}`} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
