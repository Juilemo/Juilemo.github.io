        /* Custom Font Setup */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-window: #ffffff;
            --bg-sidebar: rgba(243, 244, 246, 0.9);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --terminal-bg: #1e1e1e;
        }

        body.dark-mode {
            --bg-window: #1f2937; /* Gray 800 */
            --bg-sidebar: rgba(17, 24, 39, 0.9); /* Gray 900 */
            --text-primary: #f3f4f6; /* Gray 100 */
            --text-secondary: #9ca3af; /* Gray 400 */
            --border-color: #374151; /* Gray 700 */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.3s, background-color 0.3s;
        }

        /* Wallpapers */
        .bg-wallpaper {
            background: url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2940&q=80') no-repeat center center fixed;
            background-size: cover;
            transition: filter 0.5s;
        }
        
        body.dark-mode .bg-wallpaper {
            filter: brightness(0.6);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        body.dark-mode .glass {
            background: rgba(0, 0, 0, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Dock Animation */
        .dock-container {
            transition: transform 0.2s;
        }
        .dock-icon {
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom;
        }
        .dock-icon:hover {
            transform: scale(1.2) translateY(-10px);
            margin: 0 10px;
        }
        
        /* Window Styles */
        .window {
            transition: opacity 0.2s, width 0.3s, height 0.3s, transform 0.2s; 
            box-shadow: 0 0px 15px rgba(0,0,0,0.1), 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: absolute;
            background-color: var(--bg-window);
            color: var(--text-primary);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        body.dark-mode .window {
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .window-animating {
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Common Scrollbar */
        .window-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.2) transparent;
        }
        .window-content::-webkit-scrollbar {
            width: 8px;
        }
        .window-content::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        body.dark-mode .window-content::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.2);
        }

        /* Sidebar Selection Style */
        .sidebar-item {
            border-radius: 6px;
            transition: background-color 0.1s;
            color: var(--text-secondary);
        }
        .sidebar-item:hover {
            background-color: rgba(0,0,0,0.05);
        }
        body.dark-mode .sidebar-item:hover {
            background-color: rgba(255,255,255,0.1);
        }
        .sidebar-item.active {
            background-color: rgba(0,0,0,0.1);
            color: var(--text-primary);
            font-weight: 500;
        }
        body.dark-mode .sidebar-item.active {
            background-color: rgba(255,255,255,0.15);
        }

        /* Chat Bubbles */
        .chat-bubble-user {
            background-color: #007AFF;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .chat-bubble-ai {
            background-color: #E9E9EB;
            color: black;
            border-radius: 18px 18px 18px 4px;
        }
        body.dark-mode .chat-bubble-ai {
            background-color: #374151;
            color: white;
        }
        
        /* A4 Paper */
        .a4-paper {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            color: #333;
            font-size: 14px;
            line-height: 1.6;
            transition: none; /* Paper always stays white */
        }

        /* Terminal Cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* Mobile Handling */
        @media (max-width: 768px) {
            .window {
                width: 100% !important;
                height: calc(100% - 80px) !important;
                top: 30px !important;
                left: 0 !important;
                border-radius: 0 0 10px 10px;
            }
            .a4-paper {
                width: 100%;
                padding: 15px;
                min-height: auto;
            }
            .hide-on-mobile {
                display: none;
            }
        }
        
        /* Utility for dark mode text */
        .text-theme-primary { color: var(--text-primary); }
        .text-theme-secondary { color: var(--text-secondary); }
        .bg-theme-window { background-color: var(--bg-window); }
        .bg-theme-sidebar { background-color: var(--bg-sidebar); }
        .border-theme { border-color: var(--border-color); }

    </style>
</head>

        // --- Core Logic ---

        function openWindow(appId) {
            const container = document.getElementById('windows-container');
            
            if (document.getElementById(`window-${appId}`)) {
                bringToFront(appId);
                restoreWindow(appId);
                return;
            }

            const app = windows[appId];
            if(!app) return;

            const dot = document.getElementById(`dot-${appId}`);
            if(dot) dot.style.opacity = '1';
            
            const icon = dot ? dot.parentElement : null;
            if(icon) {
                icon.style.transform = "translateY(-15px)";
                setTimeout(() => icon.style.transform = "", 200);
            }

            const win = document.createElement('div');
            win.id = `window-${appId}`;
            win.className = `window rounded-lg overflow-hidden`;
            
            const offset = document.querySelectorAll('.window').length * 20;
            win.style.width = app.width + 'px';
            win.style.height = app.height + 'px';
            win.style.top = (app.y + offset) + 'px';
            win.style.left = (app.x + offset) + 'px';
            win.style.zIndex = ++maxZIndex;
            
            win.style.opacity = '0';
            win.style.transform = 'scale(0.95)';

            // Render content using dynamic function
            const contentHTML = app.render();
            const winTitle = getTexts().windows[appId] || "Window";
            
            // Header Color logic: Terminal and Preview are always dark-ish, others follow theme
            const isAlwaysDark = appId === 'terminal';
            let headerClass = isAlwaysDark ? 'bg-[#323639] text-gray-400 border-black/20' : 'bg-gray-200/90 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-black/5 dark:border-white/10';

            win.innerHTML = `
                <!-- Window Header (Draggable Area) -->
                <div class="h-8 ${headerClass} border-b flex items-center px-3 cursor-default select-none relative" id="header-${appId}">
                    <div class="flex gap-2 group z-10 absolute left-3">
                        <div onclick="closeWindow('${appId}', event)" class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e] hover:bg-[#ff5f56]/80 flex items-center justify-center cursor-pointer text-[8px] text-black/0 group-hover:text-black/50 transition-colors" title="Close">x</div>
                        <div onclick="minimizeWindow('${appId}', event)" class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123] hover:bg-[#ffbd2e]/80 flex items-center justify-center cursor-pointer text-[8px] text-black/0 group-hover:text-black/50 transition-colors" title="Minimize">-</div>
                        <div onclick="maximizeWindow('${appId}', event)" class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29] hover:bg-[#27c93f]/80 flex items-center justify-center cursor-pointer text-[8px] text-black/0 group-hover:text-black/50 transition-colors" title="Zoom">+</div>
                    </div>
                    <div class="w-full text-center text-xs font-semibold" id="title-${appId}">${winTitle}</div>
                </div>
                <!-- Window Body -->
                <div class="flex-1 overflow-hidden relative" id="body-${appId}">
                    ${contentHTML}
                </div>
            `;

            container.appendChild(win);
            
            if(appId === 'finder') updateFinderView('overview');

            requestAnimationFrame(() => {
                win.style.opacity = '1';
                win.style.transform = 'scale(1)';
            });

            makeDraggable(win, document.getElementById(`header-${appId}`));
            win.addEventListener('mousedown', () => bringToFront(appId));

            if (appId === 'terminal') runTerminalEffect();
        }

        // --- Window Actions ---

        function closeWindow(appId, e) {
            if(e) e.stopPropagation();
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                win.style.transition = "all 0.2s ease-in";
                win.style.opacity = '0';
                win.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    win.remove();
                    const dot = document.getElementById(`dot-${appId}`);
                    if(dot) dot.style.opacity = '0';
                }, 200);
            }
        }

        function minimizeWindow(appId, e) {
            if(e) e.stopPropagation();
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                win.classList.add('window-animating');
                win.style.transform = 'translateY(100vh) scale(0.1)';
                win.style.opacity = '0';
                setTimeout(() => {
                    win.style.display = 'none'; 
                    win.classList.remove('window-animating');
                }, 300);
            }
        }
        
        function restoreWindow(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (win && win.style.display === 'none') {
                win.style.display = 'flex';
                void win.offsetWidth;
                win.classList.add('window-animating');
                win.style.transform = 'translateY(0) scale(1)';
                win.style.opacity = '1';
                setTimeout(() => {
                    win.classList.remove('window-animating');
                    bringToFront(appId);
                }, 300);
            }
        }

        function maximizeWindow(appId, e) {
            if(e) e.stopPropagation();
            const win = document.getElementById(`window-${appId}`);
            if (!win) return;
            
            win.classList.add('window-animating');
            
            if (win.dataset.maximized === "true") {
                // Restore
                win.style.top = (win.dataset.prevTop || windows[appId].y) + 'px';
                win.style.left = (win.dataset.prevLeft || windows[appId].x) + 'px';
                win.style.width = (win.dataset.prevWidth || windows[appId].width) + 'px';
                win.style.height = (win.dataset.prevHeight || windows[appId].height) + 'px';
                win.style.borderRadius = '10px';
                win.dataset.maximized = "false";
            } else {
                // Store previous state
                win.dataset.prevTop = win.style.top;
                win.dataset.prevLeft = win.style.left;
                win.dataset.prevWidth = win.style.width;
                win.dataset.prevHeight = win.style.height;

                // Maximize Logic: Fit between Menu Bar (32px) and Dock (approx 96px + gap)
                win.style.top = '32px'; 
                win.style.left = '0';
                win.style.width = '100%';
                
                // Dock is h-24 (96px) + pb-3 (12px) ~= 108px. Let's give it 110px bottom clearance.
                const menuHeight = 32;
                const dockHeight = 110;
                win.style.height = `calc(100vh - ${menuHeight}px - ${dockHeight}px)`; 
                
                win.style.borderRadius = '0 0 10px 10px';
                win.dataset.maximized = "true";
            }
            
            setTimeout(() => {
                win.classList.remove('window-animating');
            }, 300);
        }

        function bringToFront(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                win.style.zIndex = ++maxZIndex;
            }
        }
        
        // --- System Toggles ---
        
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.className = isDarkMode ? "ph-fill ph-sun text-lg cursor-pointer hover:scale-110 transition-transform text-yellow-400" : "ph ph-moon text-lg cursor-pointer hover:scale-110 transition-transform";
        }
        
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-indicator').innerText = currentLang === 'zh' ? '中' : 'En';
            
            // Re-render open windows to reflect language change
            Object.keys(windows).forEach(appId => {
                const win = document.getElementById(`window-${appId}`);
                if(win) {
                    // Update Title
                    const titleEl = document.getElementById(`title-${appId}`);
                    if(titleEl) titleEl.innerText = getTexts().windows[appId];
                    
                    // Update Content
                    const bodyEl = document.getElementById(`body-${appId}`);
                    if(bodyEl) {
                        bodyEl.innerHTML = windows[appId].render();
                        // Special init for finder
                        if(appId === 'finder') updateFinderView(document.querySelector('.sidebar-item.active')?.id?.replace('nav-', '') || 'overview');
                    }
                }
            });
            
            // Update Desktop Icons & Menu labels (Simple DOM update)
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const keys = key.split('.');
                let val = getTexts();
                keys.forEach(k => val = val[k]);
                el.innerText = val;
            });
        }

        // --- Finder Logic ---
        function updateFinderView(view) {
            const content = document.getElementById('finder-content');
            const title = document.getElementById('finder-title');
            if(!content) return;
            
            document.querySelectorAll('#finder-container .sidebar-item').forEach(el => el.classList.remove('active'));
            const navItem = document.getElementById(`nav-${view}`);
            if(navItem) navItem.classList.add('active');

            const d = getData();
            const t = getTexts().finder;
            let html = "";
            
            switch(view) {
                case 'overview':
                    title.innerText = t.overview.title;
                    html = `
                        <div class="flex items-start gap-6 mb-8">
                            <div class="w-24 h-24 rounded-full bg-gray-200 overflow-hidden shadow-inner flex-shrink-0">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mei&gender=male" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h1 class="text-3xl font-bold text-theme-primary mb-1">${d.profile.name}</h1>
                                <p class="text-theme-secondary mb-3 text-base">${d.profile.role}</p>
                                <div class="flex gap-4 text-sm text-theme-secondary">
                                     <span class="flex items-center gap-1"><i class="ph-fill ph-phone"></i> ${d.profile.phone}</span>
                                     <span class="flex items-center gap-1"><i class="ph-fill ph-envelope"></i> ${d.profile.email}</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-theme-sidebar p-6 rounded-xl border border-theme">
                            <h3 class="text-sm font-bold text-theme-secondary uppercase tracking-wider mb-3">${t.overview.intro}</h3>
                            <p class="text-theme-primary leading-relaxed">${d.profile.summary}</p>
                        </div>
                        <div class="mt-6">
                            <h3 class="text-sm font-bold text-theme-secondary uppercase tracking-wider mb-3">${t.overview.strength}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${d.profile.advantages.slice(0,4).map(adv => `
                                    <div class="flex gap-2 items-start p-3 bg-theme-window border border-theme rounded-lg shadow-sm">
                                        <i class="ph-fill ph-check-circle text-green-500 mt-1 flex-shrink-0"></i>
                                        <span class="text-xs text-theme-secondary">${adv}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    break;
                case 'education':
                    title.innerText = t.edu.title;
                    html = `
                         <h2 class="text-2xl font-bold mb-6">${t.edu.title}</h2>
                         <div class="space-y-6">
                            ${d.education.map(edu => `
                                <div class="flex gap-4 items-start border-b border-theme pb-6 last:border-0">
                                    <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-600 dark:text-blue-300 font-bold text-xl">
                                        ${edu.school[0]}
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex justify-between items-center mb-1">
                                            <h3 class="text-lg font-bold text-theme-primary">${edu.school}</h3>
                                            <span class="bg-theme-sidebar text-theme-secondary px-2 py-1 rounded text-xs font-mono">${edu.year}</span>
                                        </div>
                                        <div class="text-blue-600 dark:text-blue-400 font-medium mb-2">${edu.degree}</div>
                                        <p class="text-sm text-theme-secondary leading-relaxed">${edu.details}</p>
                                    </div>
                                </div>
                            `).join('')}
                         </div>`;
                    break;
                case 'experience':
                    title.innerText = t.exp.title;
                    html = `
                        <h2 class="text-2xl font-bold mb-6">${t.exp.title}</h2>
                        <div class="space-y-8">
                            ${d.experience.map(exp => `
                                <div class="relative pl-6 border-l-2 border-gray-200 dark:border-gray-700">
                                    <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-blue-500 border-4 border-white dark:border-gray-800"></div>
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <h3 class="text-lg font-bold text-theme-primary">${exp.company}</h3>
                                            <div class="text-blue-600 dark:text-blue-400">${exp.role}</div>
                                        </div>
                                        <span class="text-xs text-gray-400 font-mono">${exp.date}</span>
                                    </div>
                                    <ul class="space-y-2 mt-3">
                                        ${exp.details.map(det => `
                                            <li class="text-sm text-theme-secondary flex gap-2 items-start">
                                                <span class="text-gray-400 mt-1">•</span>
                                                <span class="flex-1">${marked.parseInline(det)}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>

                    break;
                case 'skills':
                    title.innerText = t.skill.title;
                    html = `
                         <h2 class="text-2xl font-bold mb-6">${t.skill.title}</h2>

                            ${d.skills.map(skill => `
                                <div class="bg-theme-sidebar p-4 rounded-xl border border-theme">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="font-bold text-theme-primary">${skill.name}</span>
                                        <i class="ph-fill ph-check-circle text-blue-500"></i>
                                    </div>
                                    <div class="text-sm text-theme-secondary">${skill.level}</div>
                                </div>
                            `).join('')}
                         </div>`;
                    break;
            }
            content.innerHTML = html;

        // --- Draggable ---
        function makeDraggable(element, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            handle.onmousedown = dragMouseDown;
            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.zIndex = ++maxZIndex;
                if (element.dataset.maximized === "true") return;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // --- Gemini AI ---
        function sendGeminiMessage() {
            const input = document.getElementById('gemini-input');
            const chatArea = document.getElementById('gemini-chat-area');
            const text = input.value.trim();
            if (!text) return;

            const userBubble = document.createElement('div');
            userBubble.className = 'flex gap-3 justify-end';
            userBubble.innerHTML = `
                <div class="chat-bubble-user px-4 py-2 text-sm shadow-sm max-w-[85%]">${text}</div>
                <div class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden flex-shrink-0">
                     <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mei&gender=male">
                </div>`;
            chatArea.appendChild(userBubble);
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            const aiLoadingBubble = document.createElement('div');
            aiLoadingBubble.id = loadingId;
            aiLoadingBubble.className = 'flex gap-3 mt-4';
            aiLoadingBubble.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center text-white text-xs flex-shrink-0"><i class="ph-fill ph-sparkle"></i></div>
                <div class="chat-bubble-ai px-4 py-2 text-sm shadow-sm"><div class="flex gap-1 h-5 items-center"><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce delay-100"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce delay-200"></div></div></div>`;
            chatArea.appendChild(aiLoadingBubble);
            chatArea.scrollTop = chatArea.scrollHeight;

            setTimeout(() => {
                document.getElementById(loadingId).remove();
                const response = generateAIResponse(text);
                const aiBubble = document.createElement('div');
                aiBubble.className = 'flex gap-3 animate-fade-in';
                aiBubble.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center text-white text-xs flex-shrink-0"><i class="ph-fill ph-sparkle"></i></div>
                    <div class="chat-bubble-ai px-4 py-2 text-sm shadow-sm max-w-[85%] prose prose-sm dark:prose-invert">${marked.parse(response)}</div>`;
                chatArea.appendChild(aiBubble);
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 800 + Math.random() * 500);
        }

        function generateAIResponse(query) {
            const q = query.toLowerCase();
            const d = getData();
            let foundInfo = [];
            
            // Basic matching logic (simple for demo)
            if (q.includes("蓝芯") || q.includes("lanxin")) {
                 const exp = d.experience.find(e => e.company.includes("Lanxin") || e.company.includes("蓝芯"));
                 if(exp) foundInfo.push(`@ ${exp.company}: \n${exp.details.join('\n')}`);
            }
            if (q.includes("english") || q.includes("英语")) {
                foundInfo.push(d.skills.find(s => s.name.includes("English") || s.name.includes("英语")).level);
            }
            
            if (foundInfo.length === 0) return currentLang === 'zh' ? "抱歉，我没有在简历中找到相关信息。你可以问我关于工作经历、技能或教育背景的问题。" : "Sorry, I couldn't find specific info in the resume. Ask me about experience, skills or education.";
            
            return foundInfo.join("\n\n");
        }

        // --- Terminal ---
        function runTerminalEffect() {
            const container = document.getElementById('typewriter-area');
            const inputLine = document.getElementById('terminal-input-line');
            if(!container) return;
            container.innerHTML = '';
            inputLine.classList.add('hidden');
            const commands = [
                { text: "System check: MeiOS Kernel v14.0.1... [OK]", delay: 200 },
                { text: "Mounting file system: /User/MeiHanbin... [OK]", delay: 500 },
                { text: "----------------------------------------", delay: 800 },
                { text: "> Loading module: Market_Analysis_Engine... [Loaded]", delay: 1100 },
                { text: "> Loading module: Creative_Design_Suite... [Loaded]", delay: 1500 },
                { text: "All systems operational.", delay: 2000 }
            ];
            commands.forEach(line => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = "mb-1";
                    div.textContent = line.text;
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                }, line.delay);
            });
            setTimeout(() => {
                inputLine.classList.remove('hidden');
                document.getElementById('term-input').focus();
            }, 2200);
        }

        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock').innerText = `${dateStr} ${timeStr}`;
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateClock, 1000);
            updateClock();
            setTimeout(() => openWindow('finder'), 500);
        });

    </script>
