  <!DOCTYPE html>

<body>

    <div id="loading" class="loading-overlay">
        <div class="text-3xl font-bold mb-4 heart-beat">正在初始化极速粒子系统...</div>
        <div class="text-sm opacity-70">需要摄像头权限 | 请允许访问</div>

            <p>状态: <span id="hand-state" class="text-yellow-400 font-bold">等待手势...</span></p>
        </div>

            <p class="font-bold text-white mb-1">指令列表:</p>
            <ul class="list-disc pl-4 space-y-1">
                <li>👆 单手 1/2/3 指: 切换数字</li>
                <li>✊ 握拳: 粒子聚拢 / 🖐 张开: 粒子扩散</li>
                <li>🫶 双手靠近(比心): 显示隐藏文字</li>

<script>
// --- 配置参数 ---
const PARTICLE_COUNT = 8000; 
const PARTICLE_SIZE = 0.35;   // 略微调小，视觉更精致
const REACTION_SPEED = 0.25; // 大幅提升响应速度 (原0.12)

// --- 全局变量 ---
let scene, camera, renderer, particles, geometry;
let currentPositions, targetPositions;
let shapes = {}; 
let currentShape = 'sphere';
let contractionFactor = 0; // 0 = 扩散, 1 = 收缩

const videoElement = document.getElementById('input-video');
const gestureText = document.getElementById('gesture-text');
const handStateText = document.getElementById('hand-state');
const loadingScreen = document.getElementById('loading');

// --- 1. 形状生成器 ---

function createTextPoints(text, options = {}) {
    const fontSize = options.fontSize || 180;
    const fontName = options.fontName || 'Arial';
    const canvasWidth = options.width || 256;
    const canvasHeight = options.height || 256;
    
    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    ctx.fillStyle = 'white';
    ctx.font = `bold ${fontSize}px ${fontName}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.fillText(text, canvasWidth / 2, canvasHeight / 2);

    const imageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    const data = imageData.data;
    const points = [];
    
    const step = 2; 
    
    for (let y = 0; y < canvasHeight; y += step) {
        for (let x = 0; x < canvasWidth; x += step) {
            const index = (y * canvasWidth + x) * 4;
            if (data[index] > 128) {
                points.push({
                    x: (x - canvasWidth / 2) * 0.08,
                    y: -(y - canvasHeight / 2) * 0.08,
                    z: 0
                });
            }
        }
    }
    return points;
}

function createSpherePoints(count, radius) {
    const points = [];
    // 创建一个体积云，而不仅仅是表面，这样看起来更像"散开"
    for (let i = 0; i < count; i++) {
        const r = radius * Math.cbrt(Math.random()); // 均匀填充球体体积
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        points.push({
            x: r * Math.sin(phi) * Math.cos(theta),
            y: r * Math.sin(phi) * Math.sin(theta),
            z: r * Math.cos(phi)
        });
    }
    return points;
}

function initShapes() {
    shapes['1'] = createTextPoints('1');
    shapes['2'] = createTextPoints('2');
    shapes['3'] = createTextPoints('3');
    
    shapes['love'] = createTextPoints('我爱你，特特', {
        width: 800, 
        height: 200, 
        fontSize: 100, 
        fontName: 'Microsoft YaHei'
    });

    // 增加散开时的范围，设为 12
    shapes['sphere'] = createSpherePoints(PARTICLE_COUNT, 12);
    
    console.log("Shapes loaded. Love points:", shapes['love'].length);
}

// --- 2. Three.js 初始化 ---

function initThree() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
    container.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();
    currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    targetPositions = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        currentPositions[i] = (Math.random() - 0.5) * 80;
        targetPositions[i] = (Math.random() - 0.5) * 20;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

    const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

    const material = new THREE.PointsMaterial({
        color: 0x00ffff,
        size: PARTICLE_SIZE,
        map: sprite,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    particles = new THREE.Points(geometry, material);
    scene.add(particles);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function updateTargetPositions() {
    const targetShapePoints = shapes[currentShape] || shapes['sphere'];
    const spherePoints = shapes['sphere'];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        let p;
        if (i < targetShapePoints.length) {
            p = targetShapePoints[i];
        } else {
            const idx = i % spherePoints.length;
            p = spherePoints[idx];
        }
        
        // 握拳收缩逻辑
        let scale = 1;
        if (contractionFactor > 0.05) {
             // 快速收缩公式
             scale = Math.max(0.01, 1 - Math.pow(contractionFactor, 0.3));
        }

        targetPositions[i * 3] = p.x * scale;
        targetPositions[i * 3 + 1] = p.y * scale;
        targetPositions[i * 3 + 2] = p.z * scale;
    }
}

function animate() {
    requestAnimationFrame(animate);

    updateTargetPositions();

    const positions = particles.geometry.attributes.position.array;
    
    const time = Date.now() * 0.001;
    
    if (currentShape === 'love') {
        const hue = 0.9 + Math.sin(time * 3) * 0.05; 
        particles.material.color.setHSL(hue, 1.0, 0.6);
        particles.rotation.y = Math.sin(time * 0.8) * 0.2; 
    } else if (contractionFactor > 0.8) {
        particles.material.color.setHex(0xffaa00);
        particles.rotation.y += 0.1; // 极速旋转
    } else if (currentShape === 'sphere') {
        // 散开状态：蓝色星云
        particles.material.color.setHex(0x0088ff);
        particles.rotation.y += 0.001;
    } else {
        // 数字状态：青色
        particles.material.color.setHex(0x00ffff);
        particles.rotation.y += 0.005;
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const ix = i * 3;
        const iy = i * 3 + 1;
        const iz = i * 3 + 2;

        const vibe = (contractionFactor > 0.5) ? 0.5 : 0.05;

        // 使用 lerp 进行位置更新，REACTION_SPEED 决定速度
        positions[ix] += (targetPositions[ix] - positions[ix]) * REACTION_SPEED + (Math.random() - 0.5) * vibe;
        positions[iy] += (targetPositions[iy] - positions[iy]) * REACTION_SPEED + (Math.random() - 0.5) * vibe;
        positions[iz] += (targetPositions[iz] - positions[iz]) * REACTION_SPEED + (Math.random() - 0.5) * vibe;
    }

    particles.geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}


// --- 3. 手势识别高级逻辑 ---

function getFingerCount(landmarks) {
    let count = 0;
    if (landmarks[8].y < landmarks[6].y) count++; // 食指
    if (landmarks[12].y < landmarks[10].y) count++; // 中指
    if (landmarks[16].y < landmarks[14].y) count++; // 无名指
    return count;
}

function getHandOpenness(landmarks) {
    const wrist = landmarks[0];
    const tips = [8, 12, 16]; 
    let dist = 0;
    tips.forEach(i => {
        dist += Math.hypot(landmarks[i].x - wrist.x, landmarks[i].y - wrist.y);
    });
    const avg = dist / tips.length;
    return Math.max(0, Math.min(1, (avg - 0.15) / 0.2)); 
}

function onResults(results) {
    loadingScreen.style.opacity = 0;
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);

    let detectedMode = 'IDLE';
    let opennessSum = 0;
    let handCount = 0;

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handCount = results.multiHandLandmarks.length;
        
        // --- 双手逻辑 ---
        if (handCount === 2) {
            const h1 = results.multiHandLandmarks[0];
            const h2 = results.multiHandLandmarks[1];
            const dist = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
            
            if (dist < 0.25) {
                detectedMode = 'LOVE';
                currentShape = 'love';
                gestureText.innerText = "❤️ 我爱你，特特 ❤️";
                gestureText.className = "text-pink-500 font-bold text-2xl heart-beat";
                contractionFactor = 0; 
            }
            opennessSum = (getHandOpenness(h1) + getHandOpenness(h2)) / 2;
        } 
        
        // --- 单手逻辑 ---
        if (detectedMode !== 'LOVE') {
            const landmarks = results.multiHandLandmarks[0]; 
            const fingers = getFingerCount(landmarks);
            opennessSum = getHandOpenness(landmarks);

            if (opennessSum > 0.5) { 
                if (fingers === 1) {
                    currentShape = '1';
                    gestureText.innerText = "数字 1";
                    gestureText.className = "text-cyan-400 font-bold text-xl";
                } else if (fingers === 2) {
                    currentShape = '2';
                    gestureText.innerText = "数字 2";
                    gestureText.className = "text-cyan-400 font-bold text-xl";
                } else if (fingers === 3) {
                    currentShape = '3';
                    gestureText.innerText = "数字 3";
                    gestureText.className = "text-cyan-400 font-bold text-xl";
                } else {
                    // 五指张开但不构成数字
                    gestureText.innerText = "手掌张开";
                    gestureText.className = "text-gray-300 font-bold text-xl";
                }
            } else {
                 gestureText.innerText = "握拳控制";
                 gestureText.className = "text-yellow-400 font-bold text-xl";
            }
        }

        // --- 收缩/扩散控制 ---
        if (detectedMode !== 'LOVE') {
            const targetContraction = 1.0 - opennessSum;
            // 响应更快
            contractionFactor += (targetContraction - contractionFactor) * 0.25;
            
            if (contractionFactor > 0.6) {
                handStateText.innerText = "聚拢 (握拳)";
                handStateText.className = "text-red-500 font-bold";
            } else {
                handStateText.innerText = "扩散 (张开)";
                handStateText.className = "text-green-400 font-bold";
            }
        } else {
             handStateText.innerText = "爱心展示中";
             handStateText.className = "text-pink-500 font-bold";
        }

    } else {
        // --- 无手势检测：重置状态 ---
        currentShape = 'sphere'; // 设为球体（散开）
        gestureText.innerText = ""; // 隐藏文字
        handStateText.innerText = "未检测到手";
        handStateText.className = "text-gray-500";
        
        // 快速让粒子散开 (contraction -> 0)
        contractionFactor += (0 - contractionFactor) * 0.2;
    }
}

// --- 启动 ---
window.onload = function() {
    initShapes();
    initThree();
    animate();

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 640,
        height: 480
    });
    
    cameraUtils.start().catch(e => {
        loadingScreen.innerHTML = `<div class="text-red-500">无法启动摄像头</div>`;
    });
};
</script>
